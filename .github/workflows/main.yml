name: "Nix CI"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Format Nix files
        run: |
          find . -name '*.nix' -type f -print0 | xargs -0 nix run .#formatter.x86_64-linux --

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: format Nix files"

  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest

    needs: format
    if: |
      always() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs

  build:
    name: Build ${{ matrix.host }}
    needs: flake-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        host:
          - desktop
          - hp-laptop
          - framework-laptop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Build ${{ matrix.host }}
        run: >
          nix build
          .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
          --no-update-lock-file
          --print-build-logs
