name: "Nix CI"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Format Nix files
        run: nix run .#formatter.x86_64-linux -- $(find . -name '*.nix' -type f)

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: format Nix files"

  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs

  build:
    name: Build ${{ matrix.host }}
    needs: flake-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        host:
          - desktop
          - hp-laptop
          - framework-laptop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Build ${{ matrix.host }}
        run: >
          nix build
          .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
          --no-update-lock-file
          --print-build-logs
